<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd8ff">
<title>Zıpla Pofuduk!</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;touch-action:manipulation;overscroll-behavior:none;background:#8fd8ff;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);pointer-events:none;color:#3b2a6b;font-weight:900}
  .box{background:rgba(255,255,255,.85);border-radius:22px;padding:6px 16px;text-align:center;box-shadow:0 4px 0 rgba(59,42,107,.18);min-width:42%}
  .box small{display:block;font-size:clamp(13px,3.6vw,18px);opacity:.75}
  .box b{font-size:clamp(34px,10vw,52px);line-height:1}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#3b2a6b;background:rgba(143,216,255,.35)}
  .overlay.hide{display:none}
  .card{background:#fff;border-radius:32px;padding:26px 24px;max-width:340px;width:90%;box-shadow:0 8px 0 rgba(59,42,107,.2)}
  .card h1{margin:0 0 6px;font-size:clamp(30px,9vw,42px)}
  .card p{margin:8px 0 16px;font-size:clamp(16px,4.6vw,20px);line-height:1.35;font-weight:700}
  .face{font-size:64px;line-height:1}
  button{font:inherit;font-weight:900;font-size:clamp(22px,6.5vw,28px);color:#fff;background:#ff6fa5;border:0;border-radius:999px;padding:14px 36px;box-shadow:0 6px 0 #d94b83;touch-action:manipulation}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #d94b83}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="box"><small>Skor</small><b id="score">0</b></div>
  <div class="box"><small>En Yüksek Skor</small><b id="best">0</b></div>
</div>

<div class="overlay" id="start">
  <div class="card">
    <div class="face">🐰</div>
    <h1>Zıpla Pofuduk!</h1>
    <p>Ekrana dokun, Pofuduk zıplasın! Engellerin üstünden atla ve en yüksek skoru yap.</p>
    <button id="startBtn">Başla</button>
  </div>
</div>

<div class="overlay hide" id="over">
  <div class="card">
    <div class="face">😵</div>
    <h1>Eyvah!</h1>
    <p>Skorun: <span id="finalScore">0</span><br><span id="msg"></span></p>
    <button id="retryBtn">Tekrar Dene</button>
  </div>
</div>

<script>
(function(){
  const cv=document.getElementById('game'),ctx=cv.getContext('2d');
  const $=id=>document.getElementById(id);
  const scoreEl=$('score'),bestEl=$('best');
  let W,H,groundY,u,dpr;
  let state='ready',score=0,best=0,speed,frame=0,spawnIn,obstacles=[],clouds=[],particles=[];
  try{best=parseInt(localStorage.getItem('pofuduk_best'))||0}catch(e){}
  bestEl.textContent=best;

  const p={x:0,y:0,vy:0,onGround:true,squash:1,t:0};

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2.5);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    u=Math.max(Math.min(W,H)/360,0.8);
    groundY=H*0.78;
    p.x=W*0.2;
    if(p.onGround)p.y=groundY;
    if(!clouds.length)for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:H*0.12+Math.random()*H*0.25,s:0.7+Math.random()*0.8});
  }
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  resize();

  function reset(){
    score=0;speed=3.6*u;frame=0;spawnIn=70;obstacles=[];particles=[];
    p.y=groundY;p.vy=0;p.onGround=true;p.squash=1;
    scoreEl.textContent=0;
  }
  function jump(){
    if(state!=='play')return;
    if(p.onGround){
      p.vy=-12.6*u;p.onGround=false;p.squash=1.3;
      for(let i=0;i<6;i++)particles.push({x:p.x,y:groundY,vx:(Math.random()-0.5)*3*u,vy:-Math.random()*2*u,l:20,c:'#fff'});
    }
  }
  function start(){reset();state='play';$('start').classList.add('hide');$('over').classList.add('hide');jump()}
  function gameOver(){
    state='over';
    let m='';
    if(score>best){best=score;try{localStorage.setItem('pofuduk_best',best)}catch(e){};m='Yeni rekor! Harikasın! 🎉'}
    else m='Bir daha dene, yapabilirsin! 💪';
    bestEl.textContent=best;$('finalScore').textContent=score;$('msg').textContent=m;
    setTimeout(()=>$('over').classList.remove('hide'),350);
  }

  $('startBtn').addEventListener('click',start);
  $('retryBtn').addEventListener('click',start);
  const tap=e=>{
    if(e.target.tagName==='BUTTON')return;
    e.preventDefault();
    if(state==='play')jump();
  };
  document.addEventListener('touchstart',tap,{passive:false});
  document.addEventListener('mousedown',e=>{if(!('ontouchstart' in window))tap(e)});
  document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();state==='play'?jump():start()}});
  ['gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

  function spawn(){
    const t=Math.random();
    let o;
    if(t<0.4)o={type:'cactus',w:30*u,h:(44+Math.random()*14)*u};
    else if(t<0.75)o={type:'mush',w:40*u,h:36*u};
    else o={type:'cupcake',w:34*u,h:44*u};
    o.x=W+40;
    obstacles.push(o);
  }

  function update(){
    frame++;
    clouds.forEach(c=>{c.x-=0.3*u*c.s;if(c.x<-100*u)c.x=W+60*u});
    if(state!=='play')return;
    speed=Math.min(3.6*u+score*0.05*u,8.5*u);
    p.vy+=0.62*u;p.y+=p.vy;
    if(p.y>=groundY){
      if(!p.onGround)p.squash=0.7;
      p.y=groundY;p.vy=0;p.onGround=true;
    }
    p.squash+=(1-p.squash)*0.15;
    p.t+=0.25;
    spawnIn--;
    if(spawnIn<=0){
      spawn();
      const gap=(60+Math.random()*50)*(4.5*u/speed)+40;
      spawnIn=Math.max(gap,55);
    }
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];o.x-=speed;
      if(o.x+o.w<-20){obstacles.splice(i,1);score++;scoreEl.textContent=score;continue}
      const r=17*u,cx=p.x,cy=p.y-r;
      const pad=0.2;
      const ox=o.x+o.w*pad,ow=o.w*(1-2*pad),oy=groundY-o.h*0.9;
      const nx=Math.max(ox,Math.min(cx,ox+ow)),ny=Math.max(oy,Math.min(cy,groundY));
      const dx=cx-nx,dy=cy-ny;
      if(dx*dx+dy*dy<(r*0.8)*(r*0.8))gameOver();
    }
    particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.1*u;q.l--});
    particles=particles.filter(q=>q.l>0);
  }

  function drawBunny(){
    const r=20*u;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.scale(2-p.squash>1.4?1.4:2-p.squash,p.squash);
    const tilt=p.onGround?0:Math.max(-0.3,Math.min(0.3,p.vy*0.02));
    ctx.rotate(tilt);
    // shadow handled outside
    // ears
    ctx.fillStyle='#fff';ctx.strokeStyle='#e9d5f5';ctx.lineWidth=2*u;
    const earSwing=p.onGround?Math.sin(p.t)*0.05:-0.25;
    [[-8,-1],[8,1]].forEach(([ex,s])=>{
      ctx.save();ctx.translate(ex*u,-r*1.55);ctx.rotate(earSwing*s+s*0.1);
      ctx.beginPath();ctx.ellipse(0,0,6*u,15*u,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffb3d1';ctx.beginPath();ctx.ellipse(0,1*u,3*u,10*u,0,0,7);ctx.fill();
      ctx.restore();ctx.fillStyle='#fff';
    });
    // body
    ctx.beginPath();ctx.arc(0,-r,r,0,7);ctx.fill();ctx.stroke();
    // cheeks
    ctx.fillStyle='rgba(255,130,170,.55)';
    ctx.beginPath();ctx.arc(-11*u,-r+6*u,5*u,0,7);ctx.arc(11*u,-r+6*u,5*u,0,7);ctx.fill();
    // eyes
    ctx.fillStyle='#3b2a6b';
    const blink=(frame%140)<6;
    if(state==='over'){
      ctx.lineWidth=2.5*u;ctx.strokeStyle='#3b2a6b';
      [-7,7].forEach(x=>{ctx.beginPath();ctx.moveTo((x-3)*u,-r-6*u);ctx.lineTo((x+3)*u,-r);ctx.moveTo((x+3)*u,-r-6*u);ctx.lineTo((x-3)*u,-r);ctx.stroke()});
    }else if(blink){
      ctx.fillRect(-10*u,-r-3*u,6*u,2*u);ctx.fillRect(4*u,-r-3*u,6*u,2*u);
    }else{
      ctx.beginPath();ctx.arc(-7*u,-r-3*u,3.2*u,0,7);ctx.arc(7*u,-r-3*u,3.2*u,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6*u,-r-4*u,1.1*u,0,7);ctx.arc(8*u,-r-4*u,1.1*u,0,7);ctx.fill();
    }
    // nose & smile
    ctx.fillStyle='#ff6fa5';ctx.beginPath();ctx.arc(0,-r+3*u,2.4*u,0,7);ctx.fill();
    ctx.strokeStyle='#3b2a6b';ctx.lineWidth=1.8*u;ctx.beginPath();
    if(state==='over')ctx.arc(0,-r+13*u,4*u,3.3,6.1);else ctx.arc(0,-r+6*u,5*u,0.2,2.9);
    ctx.stroke();
    // feet
    ctx.fillStyle='#fff';ctx.strokeStyle='#e9d5f5';ctx.lineWidth=2*u;
    const fo=p.onGround&&state==='play'?Math.sin(p.t*1.4)*4*u:0;
    ctx.beginPath();ctx.ellipse(-9*u+fo,-1*u,8*u,4.5*u,0,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(9*u-fo,-1*u,8*u,4.5*u,0,0,7);ctx.fill();ctx.stroke();
    ctx.restore();
  }

  function drawObstacle(o){
    const x=o.x,w=o.w,h=o.h,y=groundY;
    ctx.save();ctx.lineWidth=2*u;
    if(o.type==='cactus'){
      ctx.fillStyle='#5bd68a';ctx.strokeStyle='#2f9e5b';
      rr(x+w*0.25,y-h,w*0.5,h,w*0.25);
      rr(x-w*0.1,y-h*0.65,w*0.3,h*0.28,w*0.14);
      rr(x+w*0.8,y-h*0.75,w*0.3,h*0.28,w*0.14);
      face(x+w*0.5,y-h*0.55,u);
    }else if(o.type==='mush'){
      ctx.fillStyle='#fff3e0';ctx.strokeStyle='#e0b98a';
      rr(x+w*0.28,y-h*0.5,w*0.44,h*0.5,w*0.12);
      ctx.fillStyle='#ff5d73';ctx.strokeStyle='#c93a52';
      ctx.beginPath();ctx.ellipse(x+w/2,y-h*0.55,w*0.55,h*0.5,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';
      [[0.3,0.7],[0.55,0.9],[0.75,0.65]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(x+w*a,y-h*b+h*0.25,3.2*u,0,7);ctx.fill()});
      face(x+w*0.5,y-h*0.25,u*0.8);
    }else{
      ctx.fillStyle='#ffd27a';ctx.strokeStyle='#d9a441';
      ctx.beginPath();ctx.moveTo(x+w*0.1,y-h*0.55);ctx.lineTo(x+w*0.2,y);ctx.lineTo(x+w*0.8,y);ctx.lineTo(x+w*0.9,y-h*0.55);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff9ec7';ctx.strokeStyle='#e0679d';
      ctx.beginPath();ctx.ellipse(x+w/2,y-h*0.6,w*0.6,h*0.22,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(x+w/2,y-h*0.95,4.5*u,0,7);ctx.fill();
      face(x+w*0.5,y-h*0.3,u*0.8);
    }
    ctx.restore();
  }
  function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill();ctx.stroke()}
  function face(x,y,s){
    ctx.fillStyle='#3b2a6b';
    ctx.beginPath();ctx.arc(x-5*s,y,2.2*s,0,7);ctx.arc(x+5*s,y,2.2*s,0,7);ctx.fill();
    ctx.strokeStyle='#3b2a6b';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.arc(x,y+2*s,4*s,0.2,2.9);ctx.stroke();
  }

  function draw(){
    const g=ctx.createLinearGradient(0,0,0,groundY);
    g.addColorStop(0,'#8fd8ff');g.addColorStop(1,'#d9f3ff');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // sun
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(W*0.82,H*0.3,28*u,0,7);ctx.fill();
    // clouds
    ctx.fillStyle='rgba(255,255,255,.9)';
    clouds.forEach(c=>{const s=c.s*u;ctx.beginPath();ctx.arc(c.x,c.y,16*s,0,7);ctx.arc(c.x+18*s,c.y-6*s,20*s,0,7);ctx.arc(c.x+40*s,c.y,16*s,0,7);ctx.fill()});
    // hills
    ctx.fillStyle='#b8ecb0';
    ctx.beginPath();ctx.moveTo(0,groundY);
    for(let x=0;x<=W;x+=20)ctx.lineTo(x,groundY-30*u-Math.sin(x*0.012+frame*0.002)*14*u);
    ctx.lineTo(W,groundY);ctx.fill();
    // ground
    ctx.fillStyle='#7ddc78';ctx.fillRect(0,groundY,W,H-groundY);
    ctx.fillStyle='#ffdf9e';ctx.fillRect(0,groundY+16*u,W,H);
    ctx.fillStyle='#ffc978';
    const off=(frame*speed)%(60*u||1);
    for(let x=-off;x<W;x+=60*u){ctx.beginPath();ctx.ellipse(x+20*u,groundY+36*u,7*u,3.5*u,0,0,7);ctx.fill()}
    // shadow
    const sh=Math.max(0.4,1-(groundY-p.y)/(150*u));
    ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(p.x,groundY+3*u,18*u*sh,5*u*sh,0,0,7);ctx.fill();
    obstacles.forEach(drawObstacle);
    drawBunny();
    particles.forEach(q=>{ctx.globalAlpha=q.l/20;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3*u,0,7);ctx.fill()});
    ctx.globalAlpha=1;
  }

  function loop(){update();draw();requestAnimationFrame(loop)}
  speed=3.6*u;
  loop();
})();
</script>
</body>
</html>
